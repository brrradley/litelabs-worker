name: Build Docker image

on:
  push:
    branches:
      - research
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: litelabs-research-docker
  cancel-in-progress: true

env:
  IMAGE_NAME: litelabs-worker

jobs:
  build:
    # Explicit runner pin to avoid the stalled ubuntu-latest queue seen during v3 beta builds.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            LITELABS_BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:research
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:research-${{ github.sha }}
